# Публикация NuGet-пакета плагина в NuGet.org через Trusted Publishing (OIDC, без API-ключей).
# Это шаблон: перед первым релизом реального плагина, созданного из этого шаблона:
#   - обновить PackageId/Description/RepositoryUrl в src/<Плагин>/<Плагин>.csproj
#     и PluginVersion в корневом Directory.Build.props (после prepare.ps1 — уже новые);
#   - на nuget.org: учётка -> Trusted Publishing -> политика: owner, репозиторий <владелец>/<репозиторий>,
#     workflow-файл nuget-publish.yml;
#   - в секретах репозитория GitHub: NUGET_USER (имя профиля nuget.org, не email).
# Версия берётся из <PluginVersion> в Directory.Build.props; тег обязан совпадать с ней (v0.0.1 и т.п.).
name: Publish NuGet package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '10.0'

      # Таргет MarsPluginPackNuget (из mdimai666.Mars.Plugin.Sdk) сам делает publish
      # и собирает nupkg классического лейаута рядом с папкой публикации.
      - name: Pack plugin (MarsPluginPackNuget)
        run: dotnet msbuild -restore src/MyMarsPlugin/MyMarsPlugin.csproj -t:MarsPluginPackNuget -p:Configuration=Release -v:minimal

      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package
        run: dotnet nuget push src/MyMarsPlugin/bin/Release/net10.0/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
